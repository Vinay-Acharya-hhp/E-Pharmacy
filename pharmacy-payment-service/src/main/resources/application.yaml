spring:
  application:
    name: pharmacy-payment-service
  datasource:
    url: jdbc:mysql://mysql:3306/payment_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver	
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
server:
  port: 8085	
jwt:
  secret: ${JWT_SECRET}   
