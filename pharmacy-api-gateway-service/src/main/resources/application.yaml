spring:
  application:
    name: pharmacy-api-gateway

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            cors-configurations:
              '[/**]':
                # WIDE OPEN — accepts requests from ANY origin, including
                # credentialed ones (cookies/Authorization headers). This is
                # fine for local dev / a demo cluster only. Do NOT run this
                # against an environment with real user data: any website a
                # logged-in user visits could make authenticated calls to
                # this API from their browser. To go back to an explicit
                # allowlist, revert to `allowedOrigins:
                # "${CORS_ALLOWED_ORIGINS:...}"` (see git history / earlier
                # version of this file).
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:
            - id: user-registration
              uri: lb://PHARMACY-USER-SERVICE
              predicates:
                - Path=/api/customer/register
                - Method=POST
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1

            - id: user-login
              uri: lb://PHARMACY-USER-SERVICE
              predicates:
                - Path=/api/customer/login
                - Method=POST
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1

            - id: customer-service
              uri: lb://PHARMACY-USER-SERVICE
              predicates:
                - Path=/api/customer/**
              filters:
                - StripPrefix=1


            - id: medicine-service
              uri: lb://PHARMACY-MEDICINE-SERVICE
              predicates:
                - Path=/api/medicine/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1

            - id: cart-service
              uri: lb://PHARMACY-CART-SERVICE
              predicates:
                - Path=/api/cart/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1

            - id: order-service
              uri: lb://PHARMACY-ORDER-SERVICE
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1

            - id: payment-service
              uri: lb://PHARMACY-PAYMENT-SERVICE
              predicates:
                - Path=/api/payment/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA}
  instance:
    prefer-ip-address: true

server:
  port: 8080