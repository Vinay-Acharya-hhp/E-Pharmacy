spring:
  application:
    name: pharmacy-api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/customer/**

            - id: medicine-service
              uri: http://localhost:8082
              predicates:
                - Path=/medicine/**

            - id: cart-service
              uri: http://localhost:8083
              predicates:
                - Path=/cart/**

            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/order/**

server:
  port: 8080