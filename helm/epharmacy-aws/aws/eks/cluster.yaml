apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: epharmacy
  region: ap-south-1
  version: "1.35"
vpc:
  id: vpc-08173d88bda134fb8
  subnets:
    private:
      ap-south-1a: { id: subnet-047d91e3b0a673a30 }
      ap-south-1b: { id: subnet-039f0513c39dcbfcb }
iam:
  withOIDC: true
autoModeConfig: { enabled: false }
managedNodeGroups:
  - name: ng-private
    amiFamily: AmazonLinux2023
    instanceType: m7i-flex.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: true
    volumeSize: 20
