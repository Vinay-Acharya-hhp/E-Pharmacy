apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: "{{ .Values.images.order.repository }}:{{ .Values.images.order.tag }}"
          imagePullPolicy: {{ .Values.images.order.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.order.port }}
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secret
