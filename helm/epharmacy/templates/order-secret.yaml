apiVersion: v1
kind: Secret

metadata:
  name: order-service-secret
  namespace: {{ .Values.namespace }}

type: Opaque

stringData:
  DB_USERNAME: {{ .Values.secrets.order.DB_USERNAME | quote }}
  DB_PASSWORD: {{ .Values.secrets.order.DB_PASSWORD | quote }}
  JWT_SECRET: {{ .Values.secrets.order.JWT_SECRET | quote }}
