apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: "{{ .Values.images.user.repository }}:{{ .Values.images.user.tag }}"
          imagePullPolicy: {{ .Values.images.user.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.user.port }}
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secret
