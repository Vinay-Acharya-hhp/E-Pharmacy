spring:
  application:
    name: pharmacy-cart-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver	
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cache:
    type: redis    
    redis:
      time-to-live: 10m		
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA}
  instance:
    prefer-ip-address: true    

server:
  port: 8083
  
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS} 