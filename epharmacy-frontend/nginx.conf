server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check for orchestrators (k8s/ECS/etc.)
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Cache hashed build assets aggressively; Vite fingerprints filenames
    # so a new deploy naturally gets new URLs.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # React Router (client-side routing): any path that isn't a real file
    # falls back to index.html, so refreshing /medicine/12 or /login works.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
