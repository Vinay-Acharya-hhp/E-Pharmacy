
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: false

  h2:
    console:
      enabled: false

  cache:
    type: none

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-for-ci-testing
